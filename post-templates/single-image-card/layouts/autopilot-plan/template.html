<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Geist";
    font-weight: 100 900;
    src: url("../../assets/geist-sans-variable.woff2") format("woff2-variations"), url("../../assets/geist-sans-variable.woff2") format("woff2");
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px; height: 1350px; background: #171717;
    font-family: "Geist", -apple-system, "system-ui", "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", Arial, sans-serif;
    overflow: hidden; position: relative;
  }
  .glow-a { position: absolute; top: -180px; left: -220px; width: 700px; height: 700px; background: radial-gradient(circle, rgba(139,92,246,0.30) 0%, rgba(139,92,246,0) 70%); filter: blur(10px); }
  .glow-b { position: absolute; bottom: -260px; right: -240px; width: 800px; height: 800px; background: radial-gradient(circle, rgba(59,130,246,0.26) 0%, rgba(59,130,246,0) 70%); filter: blur(10px); }
  .frame { position: relative; width: 1080px; height: 1350px; padding: 72px 76px 64px 76px; display: flex; flex-direction: column; }
  .header { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand-icon { width: 60px; height: 60px; border-radius: 16px; overflow: hidden; box-shadow: 0 8px 24px rgba(139,92,246,0.35); }
  .brand-icon img { width: 100%; height: 100%; display: block; }
  .brand-name { color: #ffffff; font-size: 34px; font-weight: 700; letter-spacing: -0.02em; }
  .badge { display: inline-flex; align-items: center; padding: 10px 22px; border-radius: 999px; background: rgba(139,92,246,0.16); border: 1px solid rgba(167,139,250,0.45); color: #c4b5fd; font-size: 20px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
  .badge:empty { display: none; }
  .footer { margin-top: 48px; display: flex; align-items: center; justify-content: space-between; }
  .cta { display: inline-flex; align-items: center; gap: 12px; padding: 22px 46px; border-radius: 999px; background: linear-gradient(135deg, #8b5cf6, #3b82f6); color: #ffffff; font-size: 30px; font-weight: 700; box-shadow: 0 12px 30px rgba(99,102,241,0.4); }
  .cta svg { width: 26px; height: 26px; }
  .link-in-bio { color: #71717a; font-size: 24px; font-weight: 500; }
  .hero { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }

  /* ---- layout-specific: Autopilot week plan ---- */
  .ap-hero { justify-content: flex-start; }
  .ap-hero .eyebrow { margin-top: 44px; color: #93c5fd; font-size: 26px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 16px; }
  .ap-headline { color: #ffffff; font-size: 60px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.12; margin-bottom: 18px; }
  .ap-hero .subhead { color: #a1a1aa; font-size: 29px; font-weight: 500; line-height: 1.4; max-width: 880px; }
  .ap-hero .subhead:empty { display: none; }
  .plan { margin-top: 34px; border-radius: 30px; background: linear-gradient(165deg, rgba(255,255,255,0.055), rgba(255,255,255,0.02)); border: 1px solid rgba(255,255,255,0.09); box-shadow: 0 24px 60px rgba(0,0,0,0.35); padding: 34px 38px 32px; display: flex; flex-direction: column; gap: 26px; }
  .exams { display: flex; flex-wrap: wrap; gap: 14px; }
  .exam-chip { display: inline-flex; align-items: center; gap: 12px; padding: 10px 20px; border-radius: 999px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.10); color: #e4e4e7; font-size: 23px; font-weight: 600; }
  .exam-chip .when { color: #a1a1aa; font-weight: 500; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .c-violet { background: #a78bfa; } .c-blue { background: #60a5fa; } .c-green { background: #34d399; } .c-amber { background: #fbbf24; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 14px; align-items: end; }
  .day { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .day .mins { color: #a1a1aa; font-size: 19px; font-weight: 600; height: 24px; }
  .bar-wrap { height: 138px; width: 100%; display: flex; align-items: flex-end; justify-content: center; position: relative; }
  .bar { width: 62%; border-radius: 12px 12px 6px 6px; background: rgba(167,139,250,0.30); border: 1px solid rgba(167,139,250,0.35); }
  .day.today .bar { background: linear-gradient(180deg, #a78bfa, #3b82f6); border-color: transparent; box-shadow: 0 10px 30px rgba(99,102,241,0.55); }
  .day.rest .bar { height: 14px !important; background: transparent; border: 2px dashed rgba(255,255,255,0.18); }
  .exam-flag { position: absolute; top: -4px; left: 50%; transform: translateX(-50%); padding: 3px 10px; border-radius: 8px; font-size: 15px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #0b0b0f; white-space: nowrap; }
  .day .label { color: #a1a1aa; font-size: 21px; font-weight: 600; position: relative; }
  .day.today .label { color: #ffffff; }
  .day.today .label::after { content: ""; position: absolute; left: 50%; bottom: -12px; margin-left: -3px; width: 6px; height: 6px; border-radius: 50%; background: #c4b5fd; }
  .day.exam-day .bar { border-width: 2px; }
  .divider { height: 1px; background: rgba(255,255,255,0.08); }
  .today-head { display: flex; align-items: baseline; justify-content: space-between; }
  .today-title { color: #ffffff; font-size: 30px; font-weight: 700; letter-spacing: -0.01em; }
  .today-note { color: #a1a1aa; font-size: 21px; font-weight: 500; }
  .items { display: flex; flex-direction: column; gap: 12px; margin-top: -8px; }
  .item { display: flex; align-items: center; gap: 18px; padding: 15px 20px; border-radius: 18px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); }
  .kind { flex: none; padding: 6px 14px; border-radius: 10px; font-size: 18px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; }
  .kind-cards { background: rgba(167,139,250,0.18); color: #c4b5fd; }
  .kind-quiz { background: rgba(96,165,250,0.18); color: #93c5fd; }
  .item .topic { flex: 1; color: #f4f4f5; font-size: 25px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .count { flex: none; color: #a1a1aa; font-size: 21px; font-weight: 600; }
  .ready { display: flex; flex-direction: column; gap: 12px; }
  .ready-head { display: flex; justify-content: space-between; align-items: baseline; }
  .ready-label { color: #e4e4e7; font-size: 23px; font-weight: 600; }
  .ready-legend { display: flex; gap: 18px; color: #a1a1aa; font-size: 18px; font-weight: 600; }
  .ready-legend span { display: inline-flex; align-items: center; gap: 7px; }
  .ready-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .ready-bar { display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: rgba(255,255,255,0.06); gap: 3px; }
  .seg-secure { background: #34d399; } .seg-practised { background: #a78bfa; } .seg-new { background: rgba(255,255,255,0.12); }
</style>
</head>
<body>
  <div class="glow-a"></div>
  <div class="glow-b"></div>
  <div class="frame">

    <div class="header">
      <div class="brand">
        <div class="brand-icon"><img src="../../assets/social-media-logo-inverted.png"></div>
        <div class="brand-name">Memora</div>
      </div>
      <div class="badge">{{BADGE_TEXT}}</div>
    </div>

    <div class="hero ap-hero">
      <div class="eyebrow">{{EYEBROW}}</div>
      <h1 id="headline" class="ap-headline">{{HEADLINE}}</h1>
      <div class="subhead">{{SUBHEAD}}</div>
      <div class="plan">
        <div class="exams">{{EXAMS}}</div>
        <div class="week">{{WEEK}}</div>
        <div class="divider"></div>
        <div class="today-head"><div class="today-title">{{TODAY_LABEL}}</div><div class="today-note">{{TODAY_NOTE}}</div></div>
        <div class="items">{{SESSION_ITEMS}}</div>
        <div class="ready">{{READINESS}}</div>
      </div>
    </div>

    <div class="footer">
      <div class="cta">
        {{CTA_TEXT}}
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </div>
      <div class="link-in-bio">{{FOOTER_NOTE}}</div>
    </div>

  </div>
</body>
</html>
