<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Geist";
    font-weight: 100 900;
    src: url("../../assets/geist-sans-variable.woff2") format("woff2-variations"), url("../../assets/geist-sans-variable.woff2") format("woff2");
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px; height: 1350px; background: #171717;
    font-family: "Geist", -apple-system, "system-ui", "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", Arial, sans-serif;
    overflow: hidden; position: relative;
  }
  .glow-a { position: absolute; top: -180px; left: -220px; width: 700px; height: 700px; background: radial-gradient(circle, rgba(139,92,246,0.30) 0%, rgba(139,92,246,0) 70%); filter: blur(10px); }
  .glow-b { position: absolute; bottom: -260px; right: -240px; width: 800px; height: 800px; background: radial-gradient(circle, rgba(59,130,246,0.26) 0%, rgba(59,130,246,0) 70%); filter: blur(10px); }
  .frame { position: relative; width: 1080px; height: 1350px; padding: 72px 76px 64px 76px; display: flex; flex-direction: column; }
  .header { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand-icon { width: 60px; height: 60px; border-radius: 16px; overflow: hidden; box-shadow: 0 8px 24px rgba(139,92,246,0.35); }
  .brand-icon img { width: 100%; height: 100%; display: block; }
  .brand-name { color: #ffffff; font-size: 34px; font-weight: 700; letter-spacing: -0.02em; }
  .badge { display: inline-flex; align-items: center; padding: 10px 22px; border-radius: 999px; background: rgba(139,92,246,0.16); border: 1px solid rgba(167,139,250,0.45); color: #c4b5fd; font-size: 20px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
  .badge:empty { display: none; }
  .footer { margin-top: 48px; display: flex; align-items: center; justify-content: space-between; }
  .cta { display: inline-flex; align-items: center; gap: 12px; padding: 22px 46px; border-radius: 999px; background: linear-gradient(135deg, #8b5cf6, #3b82f6); color: #ffffff; font-size: 30px; font-weight: 700; box-shadow: 0 12px 30px rgba(99,102,241,0.4); }
  .cta svg { width: 26px; height: 26px; }
  .link-in-bio { color: #71717a; font-size: 24px; font-weight: 500; }
  .hero { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }

  /* ---- layout-specific: adaptive rebuild (results -> what changed) ---- */
  .ad-hero { justify-content: flex-start; }
  .ad-hero .eyebrow { margin-top: 44px; color: #93c5fd; font-size: 26px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 16px; }
  .ad-headline { color: #ffffff; font-size: 60px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.12; margin-bottom: 18px; }
  .ad-hero .subhead { color: #a1a1aa; font-size: 29px; font-weight: 500; line-height: 1.4; max-width: 880px; }
  .ad-hero .subhead:empty { display: none; }
  .panel { margin-top: 34px; border-radius: 30px; background: linear-gradient(165deg, rgba(255,255,255,0.055), rgba(255,255,255,0.02)); border: 1px solid rgba(255,255,255,0.09); box-shadow: 0 24px 60px rgba(0,0,0,0.35); padding: 32px 38px 30px; display: flex; flex-direction: column; gap: 22px; }
  .p-head { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .material { color: #c4b5fd; font-size: 22px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  .score { display: flex; align-items: center; gap: 16px; }
  .score-text { color: #ffffff; font-size: 26px; font-weight: 700; white-space: nowrap; }
  .score-text span { color: #a1a1aa; font-weight: 500; }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 13px; height: 13px; border-radius: 50%; display: block; }
  .dots .ok { background: #34d399; } .dots .miss { background: #f87171; }
  .note { display: flex; gap: 16px; align-items: flex-start; padding: 18px 22px; border-radius: 18px; background: linear-gradient(135deg, rgba(139,92,246,0.16), rgba(59,130,246,0.10)); border: 1px solid rgba(167,139,250,0.30); color: #ede9fe; font-size: 25px; font-weight: 500; line-height: 1.4; }
  .note svg { width: 30px; height: 30px; flex: none; margin-top: 2px; }
  .note:has(.note-text:empty) { display: none; }
  .group { display: flex; flex-direction: column; gap: 10px; }
  .group:empty { display: none; }
  .g-title { display: flex; align-items: center; gap: 12px; font-size: 21px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
  .g-title svg { width: 24px; height: 24px; }
  .g-retired { color: #6ee7b7; } .g-reworded { color: #fcd34d; } .g-new { color: #c4b5fd; }
  .change { padding: 14px 20px; border-radius: 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); }
  .change .q { color: #f4f4f5; font-size: 25px; font-weight: 600; line-height: 1.35; }
  .change .why { color: #a1a1aa; font-size: 20px; font-weight: 500; margin-top: 5px; }
  .change.retired .q { color: #a1a1aa; text-decoration: line-through; text-decoration-color: rgba(161,161,170,0.6); }
  .change .old { color: #71717a; font-size: 21px; font-weight: 500; text-decoration: line-through; margin-bottom: 6px; line-height: 1.35; }
</style>
</head>
<body>
  <div class="glow-a"></div>
  <div class="glow-b"></div>
  <div class="frame">

    <div class="header">
      <div class="brand">
        <div class="brand-icon"><img src="../../assets/social-media-logo-inverted.png"></div>
        <div class="brand-name">Memora</div>
      </div>
      <div class="badge">{{BADGE_TEXT}}</div>
    </div>

    <div class="hero ad-hero">
      <div class="eyebrow">{{EYEBROW}}</div>
      <h1 id="headline" class="ad-headline">{{HEADLINE}}</h1>
      <div class="subhead">{{SUBHEAD}}</div>
      <div class="panel">
        <div class="p-head"><div class="material">{{MATERIAL_LABEL}}</div><div class="score">{{RESULTS}}</div></div>
        <div class="note">
          <svg viewBox="0 0 24 24" fill="#c4b5fd" stroke="none"><path d="M10.5 3 L12.7 10.3 L20 12.5 L12.7 14.7 L10.5 22 L8.3 14.7 L1 12.5 L8.3 10.3 Z"/><path d="M19 2.5 L19.9 4.9 L22.3 5.8 L19.9 6.7 L19 9.1 L18.1 6.7 L15.7 5.8 L18.1 4.9 Z" opacity="0.85"/></svg>
          <div class="note-text">{{REBUILD_NOTE}}</div>
        </div>
        <div class="group">{{RETIRED}}</div>
        <div class="group">{{REWORDED}}</div>
        <div class="group">{{ADDED}}</div>
      </div>
    </div>

    <div class="footer">
      <div class="cta">
        {{CTA_TEXT}}
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </div>
      <div class="link-in-bio">{{FOOTER_NOTE}}</div>
    </div>

  </div>
</body>
</html>
