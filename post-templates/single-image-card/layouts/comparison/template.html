<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Geist";
    font-weight: 100 900;
    src: url("../../assets/geist-sans-variable.woff2") format("woff2-variations"), url("../../assets/geist-sans-variable.woff2") format("woff2");
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px; height: 1350px; background: #171717;
    font-family: "Geist", -apple-system, "system-ui", "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", Arial, sans-serif;
    overflow: hidden; position: relative;
  }
  .glow-a { position: absolute; top: -180px; left: -220px; width: 700px; height: 700px; background: radial-gradient(circle, rgba(139,92,246,0.30) 0%, rgba(139,92,246,0) 70%); filter: blur(10px); }
  .glow-b { position: absolute; bottom: -260px; right: -240px; width: 800px; height: 800px; background: radial-gradient(circle, rgba(59,130,246,0.26) 0%, rgba(59,130,246,0) 70%); filter: blur(10px); }
  .frame { position: relative; width: 1080px; height: 1350px; padding: 72px 76px 64px 76px; display: flex; flex-direction: column; }
  .header { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand-icon { width: 60px; height: 60px; border-radius: 16px; overflow: hidden; box-shadow: 0 8px 24px rgba(139,92,246,0.35); }
  .brand-icon img { width: 100%; height: 100%; display: block; }
  .brand-name { color: #ffffff; font-size: 34px; font-weight: 700; letter-spacing: -0.02em; }
  .badge { display: inline-flex; align-items: center; padding: 10px 22px; border-radius: 999px; background: rgba(139,92,246,0.16); border: 1px solid rgba(167,139,250,0.45); color: #c4b5fd; font-size: 20px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
  .badge:empty { display: none; }
  .footer { margin-top: 48px; display: flex; align-items: center; justify-content: space-between; }
  .cta { display: inline-flex; align-items: center; gap: 12px; padding: 22px 46px; border-radius: 999px; background: linear-gradient(135deg, #8b5cf6, #3b82f6); color: #ffffff; font-size: 30px; font-weight: 700; box-shadow: 0 12px 30px rgba(99,102,241,0.4); }
  .cta svg { width: 26px; height: 26px; }
  .link-in-bio { color: #71717a; font-size: 24px; font-weight: 500; }
  .hero { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }

  /* ---- layout-specific: before/after as two full-width bands stacked one above the other ---- */
  /* "The old way" band on top, "With Memora" band below, each sized to its content; the whole group is centred vertically. */
  .comparison-hero { justify-content: center; }
  .comparison-hero .eyebrow { color: #93c5fd; font-size: 26px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; }
  .comp-headline { color: #ffffff; font-size: 58px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; text-wrap: balance; }
  .bands { position: relative; display: flex; flex-direction: column; align-items: stretch; gap: 40px; margin-top: 44px; }
  .band { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; padding: 34px 40px 36px; display: flex; flex-direction: column; gap: 22px; }
  .band-new { background: linear-gradient(160deg, rgba(139,92,246,0.16), rgba(59,130,246,0.10)); border: 1px solid rgba(167,139,250,0.40); box-shadow: 0 18px 50px rgba(99,102,241,0.16); }
  .band-title { font-size: 23px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #71717a; margin-bottom: 4px; }
  .band-new .band-title { color: #c4b5fd; }
  .band-old .row { color: #a1a1aa; }
  /* down-arrow between the two bands */
  .band-arrow { align-self: center; margin: -48px 0; width: 56px; height: 56px; border-radius: 50%; background: #1f1f23; border: 1px solid rgba(167,139,250,0.45); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(0,0,0,0.45); z-index: 2; }
  .band-arrow svg { width: 26px; height: 26px; color: #c4b5fd; }
  .row { display: flex; align-items: flex-start; gap: 16px; color: #e4e4e7; font-size: 29px; font-weight: 500; line-height: 1.42; }
  .marker { flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; margin-top: 4px; display: flex; align-items: center; justify-content: center; }
  .marker-old { background: rgba(255,255,255,0.08); }
  .marker-old::after { content: ""; width: 10px; height: 2px; background: #71717a; border-radius: 1px; }
  .marker-new { background: linear-gradient(135deg, #8b5cf6, #3b82f6); }
  .marker-new::after { content: ""; width: 11px; height: 6px; border-left: 2.4px solid #fff; border-bottom: 2.4px solid #fff; transform: rotate(-45deg) translate(1px, -2px); }
</style>
</head>
<body>
  <div class="glow-a"></div>
  <div class="glow-b"></div>
  <div class="frame">

    <div class="header">
      <div class="brand">
        <div class="brand-icon"><img src="../../assets/social-media-logo-inverted.png"></div>
        <div class="brand-name">Memora</div>
      </div>
      <div class="badge">{{BADGE_TEXT}}</div>
    </div>

    <div class="hero comparison-hero">
      <div class="eyebrow">{{EYEBROW}}</div>
      <h1 id="headline" class="comp-headline">{{HEADLINE}}</h1>
      <div class="bands">
        <div class="band band-old">
          <div class="band-title">{{OLD_TITLE}}</div>
          {{OLD_ITEMS}}
        </div>
        <div class="band-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="5 12 12 19 19 12"/></svg></div>
        <div class="band band-new">
          <div class="band-title">{{NEW_TITLE}}</div>
          {{NEW_ITEMS}}
        </div>
      </div>
    </div>

    <div class="footer">
      <div class="cta">
        {{CTA_TEXT}}
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </div>
      <div class="link-in-bio">{{FOOTER_NOTE}}</div>
    </div>

  </div>
</body>
</html>
